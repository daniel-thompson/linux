%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/toshiba,tc9564-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Toshiba TC9564 Reset Controller

maintainers:
  - Alex Elder <elder@riscstar.com>
  - Daniel Thompson <daniel@riscstar.com>

description: |
  The Toshiba TC9564 is an SoC accessed by a host system through the
  upstream PCIe port on the PCIe switch it implements.  The switch
  includes an embedded PCIe endpoint that provides access to various
  SoC peripherals (including a clock controller) via its BARs.

  The SoC is represented using a devicetree PCI endpoint bus, so the
  clock controller is bound to its driver using its platform driver
  compatible string.  All of these clocks are simple gate clocks.

  A total of 21 clocks are implemented, though the PCIe clock cannot
  be disabled (because the clock controller depends on PCIe).  The
  PCIe subsystem depends on the I2C block as well, so the I2C clock
  is cannot be disabled.

  A system controller coordinates access to the two registers that
  manage the clock states (CLKCTRL0 and CLKCTRL1).

  Clock ids are defined in <dt-bindings/clock/toshiba,tc9564.h>.

properties:
  compatible:
    const: toshiba,tc9564-clock

  reg:
    items:
      - description: Offset and size of CLKCTRL0 register
      - description: Offset and size of CLKCTRL1 register

  "#clock-cells":
    const: 1

required:
  - compatible
  - reg
  - "#clock-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/toshiba,tc9564.h>

    clock@1004 {
        compatible = "toshiba,tc9564-clock";
        reg = <0x1004 0x4>, <0x100c 0x4>;
        #clock-cells = <1>;
    };
