%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/toshiba,tc9564-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Toshiba TC9564 GPIO Controller

maintainers:
  - Alex Elder <elder@riscstar.com>
  - Daniel Thompson <daniel@riscstar.com>

description: |
  The TC9564 implements 37 GPIO lines (GPIOs 0-36).  GPIOs 20 and 21
  are reserved.  GPIOs 2 and 3 are reserved for use by the PCI power
  control driver.  GPIOs 22, 23, 24, 27, 28, 31, and 34 are input-only.

  The GPIO controller registers are accessed through the parent
  "toshiba,tc9564-config" syscon regmap.

properties:
  compatible:
    const: toshiba,tc9564-gpio

  gpio-controller: true

  "#gpio-cells":
    const: 2

  gpio-ranges:
    maxItems: 1

required:
  - compatible
  - gpio-controller
  - "#gpio-cells"

unevaluatedProperties: false

examples:
  - |
    gpio {
        compatible = "toshiba,tc9564-gpio";
        gpio-controller;
        #gpio-cells = <2>;
    };
