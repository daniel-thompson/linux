%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/toshiba,tc9564.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Toshiba TC9564 System Controllers

maintainers:
  - Alex Elder <elder@riscstar.com>
  - Daniel Thompson <daniel@riscstar.com>

description: |
  The Toshiba TC9564 is an SoC accessed by a host system through the
  upstream PCIe port on the PCIe switch it implements.  The switch
  includes an embedded PCIe endpoint that provides access to various
  SoC peripherals (including a reset controller) via its BARs.

  Two system controllers manage access to memory regions that are
  shared by drivers for multiple devices.

properties:
  compatible:
    items:
      - enum:
          - toshiba,tc9564-bridge
          - toshiba,tc9564-config
      - const: syscon
      - const: simple-mfd

  reg:
    maxItems: 1

  ranges: true

  '#address-cells':
    const: 1

  '#size-cells':
    const: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    syscon@0 {
        compatible = "toshiba,tc9564-config",
                     "syscon",
                     "simple-mfd";
        reg = <0x0 0x2000>;
        #address-cells = <1>;
        #size-cells = <1>;
        ranges;
    };
