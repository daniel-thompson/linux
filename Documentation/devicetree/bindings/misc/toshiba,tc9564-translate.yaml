%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/toshiba,tc9564-translate.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Toshiba TC9564 Address Translation Unit

maintainers:
  - Alex Elder <elder@riscstar.com>
  - Daniel Thompson <daniel@riscstar.com>

description: |
  The Toshiba TC9564 is an SoC accessed by a host system through the
  upstream PCIe port on the PCIe switch it implements.  The switch
  includes an embedded PCIe endpoint that provides access to various
  SoC peripherals (including an AXI-to-PCIe address translation unit)
  via its BARs.

  The SoC is represented using a devicetree PCI endpoint bus, so the
  address translation unit is bound to its driver using its platform
  driver compatible string.

  Four available translation table entries specify an internal AXI
  bus source address, a PCIe bus translated address, and size of a
  region of memory to be translated.  The Ethernet MACs on the TC9564
  access the PCIe subsystem via this bus.

properties:
  compatible:
    const: toshiba,tc9564-translate

  reg:
    items:
      - description: Offset and size of translation table memory

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    translate@800 {
        compatible = "toshiba,tc9564-translate";
        reg = <0x0800 0x80>;
    };
